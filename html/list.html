<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>媒体库 - 视频列表</title>
  <!-- Element Plus 基础样式与暗黑主题样式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/theme-chalk/dark/css-vars.css" />
  
  <!-- Vue 3 & Element Plus & Icons JS -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue"></script>
</head>
<body>
  <div id="app">
    <el-container style="min-height: 100vh;">
      <!-- 顶栏 header -->
      <el-header style="border-bottom: 1px solid var(--el-border-color-lighter); display: flex; align-items: center; justify-content: space-between;">
        <el-space size="medium">
          <span style="font-size: 18px; font-weight: bold;">🎬 51cg1 媒体库 - 列表</span>
          <el-tag type="info" effect="plain" round>
            {{ loading ? '加载中…' : `共 ${items.length} 个 · 已看 ${seenCount}` }}
          </el-tag>
        </el-space>
        
        <el-space>
          <el-button type="danger" plain @click="btnClear">清除已看</el-button>
          <el-button type="primary" icon="Refresh" @click="load">刷新列表</el-button>
        </el-space>
      </el-header>

      <!-- 主内容区 -->
      <el-main>
        <el-row justify="center">
          <el-col :xs="24" :sm="22" :md="20" :lg="18">
            <el-card v-loading="loading" body-style="padding: 0;">
              <!-- 视频列表表格 -->
              <el-table
                v-if="items.length > 0"
                :data="items"
                style="width: 100%"
                @row-click="playVideo"
                row-style="cursor: pointer"
              >
                <el-table-column label="视频标题" min-width="260">
                  <template #default="{ row }">
                    <el-space wrap>
                      <el-tag v-if="row.viewed" type="success" size="small" effect="light">已看</el-tag>
                      <span :style="{ fontWeight: row.viewed ? 'normal' : '500' }">{{ row.title }}</span>
                    </el-space>
                  </template>
                </el-table-column>

                <el-table-column prop="downloaded_at" label="下载时间" width="180">
                  <template #default="{ row }">
                    <el-text type="info" size="small">{{ row.downloaded_at }}</el-text>
                  </template>
                </el-table-column>

                <el-table-column label="大小" width="110">
                  <template #default="{ row }">
                    <el-text type="primary" size="small">{{ fmtSize(row.size) }}</el-text>
                  </template>
                </el-table-column>

                <el-table-column label="状态" width="120">
                  <template #default="{ row }">
                    <el-tag v-if="!row.exists" type="danger" size="small" effect="dark">⚠ 文件丢失</el-tag>
                    <el-tag v-else type="info" size="small" effect="plain">正常</el-tag>
                  </template>
                </el-table-column>

                <el-table-column align="right" width="90">
                  <template #default="{ row }">
                    <el-button type="primary" size="small" link>播放</el-button>
                  </template>
                </el-table-column>
              </el-table>

              <!-- 空状态 -->
              <el-empty
                v-else-if="!loading"
                description="暂无已下载视频，先运行 crawler.py 下载"
              ></el-empty>
            </el-card>
          </el-col>
        </row>
      </el-main>
    </el-container>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;
    const { ElMessageBox, ElMessage } = ElementPlus;

    const app = createApp({
      setup() {
        const items = ref([]);
        const loading = ref(true);

        const seenCount = computed(() => items.value.filter(i => i.viewed).length);

        const fmtSize = (n) => {
          if (!n) return '';
          n = Number(n);
          if (n > 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
          if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
          return (n / 1024).toFixed(0) + ' KB';
        };

        const load = async () => {
          loading.value = true;
          try {
            const r = await fetch('/api/videos');
            const data = await r.json();
            items.value = data.items || [];
          } catch (e) {
            ElMessage.error('读取数据库失败: ' + String(e));
          } finally {
            loading.value = false;
          }
        };

        const btnClear = async () => {
          try {
            await ElMessageBox.confirm(
              '确定要一键清除所有已看视频的本地文件吗？',
              '警告',
              {
                confirmButtonText: '确定清除',
                cancelButtonText: '取消',
                type: 'warning',
              }
            );

            const response = await fetch('/api/clear_viewed', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
            });
            const result = await response.json();

            if (result.ok) {
              const freedMB = (result.freed_bytes / (1024 * 1024)).toFixed(2);
              ElMessage.success({
                message: `清理成功！已删除 ${result.deleted_count} 个文件，释放 ${freedMB} MB 空间`,
                duration: 4000
              });
              load();
            } else {
              ElMessage.error("清理失败：" + (result.error || "未知错误"));
            }
          } catch (error) {
            if (error !== 'cancel') {
              ElMessage.error("网络请求失败，请检查服务是否正常运行。");
            }
          }
        };

        const playVideo = (row) => {
          const playUrl = `play.html?file=${encodeURIComponent(row.file)}&title=${encodeURIComponent(row.title || '')}&url=${encodeURIComponent(row.url || '')}&downloaded_at=${encodeURIComponent(row.downloaded_at || '')}&size=${encodeURIComponent(row.size || 0)}&viewed=${row.viewed ? '1' : '0'}`;
          window.location.href = playUrl;
        };

        onMounted(() => {
          load();
        });

        return {
          items,
          loading,
          seenCount,
          fmtSize,
          load,
          btnClear,
          playVideo
        };
      }
    });

    // 注册所有 Element Plus 图标组件
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }

    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
